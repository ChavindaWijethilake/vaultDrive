services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: vaultdrive-migrate
    restart: "no"
    env_file:
      - .env.docker
    # Use npx explicitly as requested to avoid 'prisma not found'
    command: ["npx", "prisma", "migrate", "deploy", "--schema=prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultdrive-app
    restart: always
    ports:
      - "3001:3000"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - vaultdrive_uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    container_name: vaultdrive-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vaultdrive}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vaultdrivepass}
      - POSTGRES_DB=${POSTGRES_DB:-vaultdrive_db}
    # Expose port only for host access if needed, mapping 5433 to 5432
    ports:
      - "5433:5432"
    volumes:
      - vaultdrive_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vaultdrive} -d $${POSTGRES_DB:-vaultdrive_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vaultdrive-redis
    restart: always
    volumes:
      - vaultdrive_redisdata:/data
    ports:
      - "6380:6379"

volumes:
  vaultdrive_uploads:
  vaultdrive_pgdata:
  vaultdrive_redisdata:
