services:
  postgres:
    image: postgres:16
    container_name: vaultdrive-postgres
    environment:
      POSTGRES_USER: vaultdrive
      POSTGRES_PASSWORD: vaultdrivepass
      POSTGRES_DB: vaultdrive_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: vaultdrive-redis
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:latest
    container_name: vaultdrive-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
